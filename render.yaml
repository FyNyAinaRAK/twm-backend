databases:
  - name: twm-db
    databaseName: twm_streaming
    user: admin

services:
  - type: web
    name: twm-streaming-backend
    env: node
    buildCommand: npm install && node init_db.js
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: twm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
